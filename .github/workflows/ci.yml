name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  # go vet sebagai gate tersendiri: temuan = build gagal. Sengaja Linux saja —
  # vet lintas-GOOS (windows) masih menandai unsafe.Pointer yang disengaja di
  # internal/trust/windows_trust.go (ponytail, dilarang disentuh item ini).
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...

  # Smoke e2e siklus penuh (setup → serve → stop → Caddy nyata) pada runner
  # Linux. Test offline-aware: tanpa jaringan/Caddy, kasus Caddy skip sendiri.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags e2e ./e2e/...

  windows-launcher-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build local release staging and verify both launchers offline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOPROXY = 'off'
          $env:GOSUMDB = 'off'
          $env:GOTOOLCHAIN = 'local'
          go build -trimpath -buildvcs=false -o avior.exe .
          New-Item -ItemType Directory -Force -Path staging/bin | Out-Null
          New-Item -ItemType File -Force -Path staging/bin/caddy_windows_amd64.exe | Out-Null
          Copy-Item avior.exe staging/avior.exe
          Copy-Item release/setup.ps1, release/setup.bat staging/
          $archive = Join-Path $env:RUNNER_TEMP 'avior-windows-e2e.zip'
          bash release/package-windows.sh staging "$archive"
          $extracted = Join-Path $env:RUNNER_TEMP 'avior-windows-e2e'
          Expand-Archive -Path $archive -DestinationPath $extracted -Force
          # Isi zip relatif terhadap stage dir: avior.exe ada di root arsip.
          $launcher = $extracted
          if (-not (Test-Path (Join-Path $launcher 'avior.exe'))) {
            throw 'Archived avior.exe missing; refusing to test source-tree binary'
          }
          # PATH dibuang kecuali system32/WINDIR: satu-satunya cara launcher
          # menemukan CLI adalah direktori arsipnya sendiri. 'Commands:' hanya
          # ada di help asli CLI — error "not recognized" tidak memuatnya.
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          $psOutput = & (Join-Path $launcher 'setup.ps1') --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $psOutput -notmatch 'Commands:') {
            throw "setup.ps1 failed or did not run archive binary (exit=$LASTEXITCODE): $psOutput"
          }
          $batOutput = & cmd.exe /d /c "`"$(Join-Path $launcher 'setup.bat')`" --help" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $batOutput -notmatch 'Commands:') {
            throw "setup.bat failed or did not run archive binary (exit=$LASTEXITCODE): $batOutput"
          }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Satu sumber kebenaran versi Caddy: dibaca dari pin internal/proxy
      # (const CaddyVersion) agar CI tidak pernah berbeda dengan CLI.
      - name: Resolve pinned Caddy version
        run: |
          version=$(grep -oE 'CaddyVersion = "[0-9.]+"' internal/proxy/verify.go | grep -oE '[0-9][0-9.]*')
          echo "CADDY_VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build cross-platform archives (CLI + Caddy bundled)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist cache staging
          # Integritas upstream sebelum bundel: checksums.txt resmi Caddy
          # (sha512) memvalidasi setiap arsip yang diunduh.
          curl -fsSLo cache/caddy-checksums.txt \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_checksums.txt"
          for target in linux/amd64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            stage="staging/${os}-${arch}"
            mkdir -p "${stage}/bin"
            goos=${os} goarch=${arch} CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w" -o "${stage}/avior$( [[ ${os} == windows ]] && echo .exe )" .
            # Bundel Caddy sesuai pin CLI (Kontrak B). Nama asset upstream:
            # darwin → "mac_", windows → ".zip".
            if [[ ${os} == windows ]]; then
              asset="caddy_${CADDY_VERSION}_windows_${arch}.zip"
            elif [[ ${os} == darwin ]]; then
              asset="caddy_${CADDY_VERSION}_mac_${arch}.tar.gz"
            else
              asset="caddy_${CADDY_VERSION}_${os}_${arch}.tar.gz"
            fi
            curl -fsSLo "cache/${asset}" "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/${asset}"
            (cd cache && grep -E "  ${asset}\$" caddy-checksums.txt | sha512sum -c -)
            if [[ ${os} == windows ]]; then
              unzip -q -o "cache/${asset}" caddy.exe -d "${stage}/bin"
              mv "${stage}/bin/caddy.exe" "${stage}/bin/caddy_${os}_${arch}.exe"
            else
              tar -xzf "cache/${asset}" -C "${stage}/bin" caddy
              mv "${stage}/bin/caddy" "${stage}/bin/caddy_${os}_${arch}"
            fi
            # Bundel HARUS identik dengan pin build-time CLI (Kontrak B).
            grep -q "$(sha256sum "${stage}/bin/caddy_${os}_${arch}" | cut -d' ' -f1)" internal/proxy/pins.go \
              || { echo "Caddy ${target} tidak cocok pin internal/proxy/pins.go"; exit 1; }
            name="avior-${GITHUB_REF_NAME}-${os}-${arch}"
            if [[ ${os} == windows ]]; then
              cp release/setup.ps1 release/setup.bat "${stage}/"
              bash release/package-windows.sh "${stage}" "dist/${name}.zip"
            else
              cp release/setup.sh "${stage}/"
              tar -czf "dist/${name}.tar.gz" -C "${stage}" avior bin setup.sh
            fi
          done
          # Kontrak A — release-artifact: SHA256SUMS co-located di release.
          # Checksum unsigned = integritas, BUKAN autentisitas.
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz,dist/*.zip,dist/SHA256SUMS

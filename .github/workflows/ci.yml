name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Pipeline anvil sebagai sumber kebenaran gate kualitas: gofmt, vet,
  # unit test (definisi langkah di .anvil/pipelines/ci.yaml). Pipeline
  # anvil menjalankan satu mesin tanpa OS matrix; runner wiring tetap
  # milik workflow. Task pipeline memakai sh — jalan di Linux/macOS.
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # anvil didistribusikan via release binary (module path maleolabs.com
      # bersifat internal): unduh binary resmi, bukan go install.
      - name: Install anvil
        run: |
          curl -fsSL -o anvil "https://github.com/maleolabs/anvil/releases/download/v2.5.0/anvil-${{ runner.os == 'macOS' && 'darwin' || 'linux' }}-amd64"
          chmod +x anvil
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run CI pipeline
        run: anvil pipeline ci

  # Windows butuh runner sendiri: task pipeline anvil memakai sh, dan
  # windows-latest tidak menyediakannya di PATH default. Test tetap
  # dijalankan via go test native.
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  # Smoke e2e siklus penuh (setup → serve → stop → Caddy nyata) di runner
  # Linux. Kasus Caddy skip sendiri saat jaringan/Caddy tidak tersedia.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags e2e ./e2e/...

  # Windows launcher tidak tercakup pipeline anvil (single-machine, tidak
  # ada OS matrix): stage khusus runner tetap di workflow.
  windows-launcher-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build local release staging and verify both launchers offline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOTOOLCHAIN = 'local'
          $cli_ver = (Get-Content VERSION).Trim()
          go build -trimpath -buildvcs=false "-ldflags=-s -w -X github.com/maleolabs/avior/internal/version.version=$cli_ver" -o avior.exe .
          New-Item -ItemType Directory -Force -Path staging/bin | Out-Null
          New-Item -ItemType File -Force -Path staging/bin/caddy_windows_amd64.exe | Out-Null
          Copy-Item avior.exe staging/avior.exe
          Copy-Item release/setup.ps1, release/setup.bat staging/
          $archive = Join-Path $env:RUNNER_TEMP 'avior-windows-e2e.zip'
          bash release/package-windows.sh staging "$archive"
          $extracted = Join-Path $env:RUNNER_TEMP 'avior-windows-e2e'
          Expand-Archive -Path $archive -DestinationPath $extracted -Force
          $launcher = $extracted
          if (-not (Test-Path (Join-Path $launcher 'avior.exe'))) {
            throw 'Archived avior.exe missing; refusing to test source-tree binary'
          }
          # PATH dibuang kecuali system32/WINDIR: satu-satunya cara launcher
          # menemukan CLI adalah direktori arsipnya sendiri.
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR"
          $psOutput = & (Join-Path $launcher 'setup.ps1') --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $psOutput -notmatch 'Commands:') {
            throw "setup.ps1 failed or did not run archive binary (exit=$LASTEXITCODE): $psOutput"
          }
          $batOutput = & cmd.exe /d /c "`"$(Join-Path $launcher 'setup.bat')`" --help" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $batOutput -notmatch 'Commands:') {
            throw "setup.bat failed or did not run archive binary (exit=$LASTEXITCODE): $batOutput"
          }
